<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer glowing ring -->
  <circle cx="50" cy="50" r="46" stroke="#d4af37" stroke-width="2" opacity="0.8"/>
  <circle cx="50" cy="50" r="40" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.9"/>
  <!-- Quantum Orbital Nodes -->
  <ellipse cx="50" cy="50" rx="36" ry="14" stroke="#00e5ff" stroke-width="1.2" transform="rotate(-30 50 50)" opacity="0.7"/>
  <ellipse cx="50" cy="50" rx="36" ry="14" stroke="#d4af37" stroke-width="1.2" transform="rotate(30 50 50)" opacity="0.7"/>
  <!-- Central Sovereign Sphere -->
  <circle cx="50" cy="50" r="8" fill="url(#goldGradient)" filter="drop-shadow(0 0 8px #d4af37)"/>
  <circle cx="50" cy="50" r="3" fill="#ffffff"/>
  <!-- Orbiting Quantum Quibits -->
  <circle cx="20" cy="36" r="3" fill="#00e5ff" filter="drop-shadow(0 0 6px #00e5ff)"/>
  <circle cx="80" cy="64" r="3" fill="#00e5ff" filter="drop-shadow(0 0 6px #00e5ff)"/>
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3d997"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#997b20"/>
    </linearGradient>
  </defs>
</svg>
